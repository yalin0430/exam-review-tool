<style>
:root{--ink:#193c36;--green:#216650;--mint:#e8f1e8;--paper:#f8f7f2;--line:#dde3da;--muted:#66766e}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,"Microsoft JhengHei",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:12px 18px;background:var(--green);color:white;font-weight:650}button:hover{filter:brightness(.94)}button:disabled{opacity:.5;cursor:default}button.secondary{background:var(--mint);color:var(--ink)}button.outline{background:white;color:var(--ink);border:1px solid var(--line)}header{border-bottom:1px solid var(--line);background:#ffffffb8;padding:20px 5%;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-size:21px;font-weight:800}.brand span{background:var(--green);color:white;border-radius:12px;padding:8px;margin-right:10px}.badge{font-size:12px;border:1px solid var(--line);border-radius:20px;padding:7px 12px;color:var(--muted)}main{max-width:1160px;margin:auto;padding:36px 24px}.hero{display:flex;justify-content:space-between;align-items:center;gap:24px}.eyebrow{font-size:12px;letter-spacing:2px;color:var(--green);font-weight:700}h1{font-size:clamp(28px,4vw,44px);letter-spacing:-1px;margin:12px 0}p{line-height:1.8;color:var(--muted)}.hero-art{font-size:64px;background:#e5ecd9;border-radius:50%;width:135px;height:135px;display:grid;place-items:center;flex-shrink:0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:28px 0}.stat{background:white;padding:20px;border:1px solid var(--line);border-radius:16px}.stat strong{display:block;font-size:27px;margin-bottom:4px}.stat small{color:var(--muted)}nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}nav button{background:transparent;color:var(--muted)}nav button.active{background:var(--ink);color:white}.layout{display:grid;grid-template-columns:270px 1fr;gap:24px}.panel,.card{background:white;border:1px solid var(--line);border-radius:20px;padding:24px}h2{font-size:21px;margin:0 0 12px}h3{font-size:16px}label{display:block;font-size:13px;font-weight:700;margin:18px 0 8px}select,input,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px;background:#fff;color:var(--ink)}textarea{min-height:150px;resize:vertical}.note{font-size:12px;line-height:1.8;color:var(--muted)}.cards{display:grid;grid-template-columns:1fr 1fr;gap:14px}.card{padding:21px}.tag{font-size:11px;background:var(--mint);padding:5px 9px;border-radius:6px;display:inline-block;color:var(--green)}.card p{font-size:14px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.question{font-size:23px;line-height:1.6;margin:24px 0}.option{width:100%;text-align:left;background:white;border:1px solid var(--line);color:var(--ink);margin:6px 0;padding:16px;display:flex;gap:14px}.option.selected{border:2px solid var(--green);background:var(--mint)}.option.correct{background:#e5f4e8;border-color:#31965b}.option.wrong{background:#fff0ec;border-color:#ce735c}.feedback{padding:18px;background:var(--mint);border-radius:12px;margin-top:18px;line-height:1.8}.bar{height:7px;background:var(--mint);border-radius:10px;margin:18px 0;overflow:hidden}.bar i{display:block;background:var(--green);height:100%;transition:width .3s}.empty{text-align:center;padding:42px 18px}.empty .icon{font-size:45px}.hidden{display:none!important}footer{margin:30px 0 0;text-align:center;color:var(--muted);font-size:12px}.result-score{font-size:58px;color:var(--green);font-weight:800}.flash{border-radius:14px;background:#f4f6ee;padding:18px;margin-top:14px}.notice{padding:12px 16px;background:#f0f3e7;border-radius:12px;margin-bottom:20px;font-size:13px;line-height:1.7}button:focus-visible,a:focus-visible{outline:3px solid #d6a34b;outline-offset:3px}@media(max-width:760px){main{padding:25px 16px}.layout{grid-template-columns:1fr}.hero-art{display:none}.stats{gap:8px}.stat{padding:15px 12px}.stat strong{font-size:23px}.cards{grid-template-columns:1fr}.panel{padding:20px}header{padding:16px}.badge{font-size:10px}.brand{font-size:17px}.question{font-size:20px}nav{gap:3px}nav button{padding:11px 12px}}
.portal-switch{display:flex;gap:10px;flex-wrap:wrap;margin:24px 0 12px}.portal-switch a{padding:14px 20px;border:1px solid var(--line);border-radius:12px;text-decoration:none;color:var(--ink);background:white;font-weight:700}.portal-switch a.active{background:var(--green);color:white;border-color:var(--green)}body.admin .layout{grid-template-columns:1fr}body.admin aside,body.admin .stats,body.admin nav{display:none}.upload-box{background:var(--mint);padding:22px;border-radius:16px;margin:20px 0}.upload-box input{background:white}.manage-list{margin-top:28px}.manage-list .card{margin-top:12px}.portal-description{margin:0 0 22px;color:var(--muted);font-size:13px;line-height:1.8}
</style></head><body>
<header><div class="brand"><span>✦</span>複習研究所</div><div class="badge">離線可用 · 示範題庫</div></header>
<main><section class="hero"><div><div class="eyebrow">每天一點，離目標更近一點</div><h1>把知識讀懂，把考題練熟。</h1><p>先複習重點，再用測驗找出盲點。<br>你的考試準備，從這裡開始。</p></div><div class="hero-art" aria-hidden="true">📚</div></section>
<section class="stats"><div class="stat"><strong id="total">0</strong><small>可練習題目</small></div><div class="stat"><strong id="accuracy">—</strong><small>累計答對率</small></div><div class="stat"><strong id="wrongCount">0</strong><small>待複習錯題</small></div></section>
<div class="portal-switch" aria-label="前後台入口"><a id="frontLink" href="#practice">前台 · 考試練習</a><a id="adminLink" href="#admin">後台 · 考題上傳</a></div><p id="portalDescription" class="portal-description"></p>
<nav aria-label="練習功能"><button data-tab="quiz">考試練習</button><button data-tab="review">重點複習</button><button data-tab="wrong">錯題筆記</button></nav>
<div class="layout"><aside class="panel"><h2>我的學習設定</h2><p class="note">選擇主題，安排今天的練習。</p><label for="subject">複習主題</label><select id="subject"><option value="all">全部主題</option><option value="ai">人工智慧基礎</option><option value="esg">永續發展基礎</option><option value="study">學習與訓練</option><option value="custom">我的自訂題目</option></select><label for="amount">每回合題數</label><select id="amount"><option value="5">5 題 · 小試身手</option><option value="10">10 題 · 完整練習</option><option value="99">全部題目</option></select><label for="mode">練習方式</label><select id="mode"><option value="instant">即時解析 · 邊做邊學</option><option value="exam">模擬考試 · 最後看解析</option></select><div class="flash"><strong>💡 今日學習提示</strong><p class="note">試著先不看筆記回答問題，再檢查答案。主動回想，比反覆閱讀更能幫你找到不熟悉的地方。</p></div><p class="note">本工具依題庫隨機組題；新增自己的題目即可練習其他科目。學習紀錄儲存在此瀏覽器。</p></aside>
<section id="content" class="panel" aria-live="polite"></section></div><footer>複習研究所 · 示範內容供練習使用，正式考試請以指定教材為準。</footer></main>
<script>
const seed=[

{id:'a2',s:'ai',q:'要讓人工智慧協助設計課程，哪種提示較清楚？',o:['幫我弄一下','隨便寫課程','指定學員、目標、時數與輸出格式','越短越好，完全不給背景'],a:2,e:'提示（Prompt）應提供背景、任務、限制及輸出格式，例如「為初學者設計 3 小時課程，以表格列出活動與成果」。',k:'提示設計',r:'明確說明對象、任務、限制與輸出格式，讓結果更符合需求。'},
{id:'a3',s:'ai',q:'人工智慧產生看似合理卻不正確的資訊，通常稱為什麼？',o:['幻覺','資料壓縮','版本更新','加密'],a:0,e:'幻覺（Hallucination）是模型產生錯誤或缺乏根據的內容。引用、數字與專業資訊應核對來源。',k:'資訊查核',r:'核對來源與證據，尤其是數據、引文及專業判斷。'},

{id:'e3',s:'esg',q:'企業購買電力所對應的間接排放，通常屬於哪個範疇？',o:['範疇一','範疇二','不必計算','只看員工人數'],a:1,e:'範疇二（Scope 2）涵蓋外購電力、蒸汽、熱能或冷卻等能源的間接排放。',k:'能源間接排放',r:'外購能源的間接排放通常歸入範疇二，需注意盤查邊界。'},

{id:'s2',s:'study',q:'將複習分散在不同天進行，稱為什麼？',o:['間隔練習','一次背完','隨機刪除','被動抄寫'],a:0,e:'間隔練習（Spaced Practice）讓複習分散於不同時間，搭配主動回想可幫助長期記憶。',k:'間隔練習',r:'分散複習時間，例如隔天、數天後再練一次，避免只在考前集中閱讀。'},
{id:'s3',s:'study',q:'企業訓練後，哪項活動最能協助工作應用？',o:['不再追蹤','只記錄座位','制定實作任務並回饋成果','只看投影片數量'],a:2,e:'以實際工作任務驗證能力，再透過回饋修正，能支持學習移轉。',k:'學習移轉',r:'訓練後安排工作任務、主管支持與回饋，協助將技能帶回工作。'},

const names={ai:'人工智慧基礎',esg:'永續發展基礎',study:'學習與訓練',custom:'我的自訂題目'};
const $=id=>document.getElementById(id),esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let saved={},storageOK=true;try{saved=JSON.parse(localStorage.getItem('review-lab-v1')||'{}')||{}}catch(e){storageOK=false}

function bank(){return [...seed,...custom]}function pool(){return bank().filter(t=>$('subject').value==='all'||t.s===$('subject').value)}

function stats(){$('total').textContent=bank().length;$('accuracy').textContent=attempts?Math.round(hits/attempts*100)+'%':'—';$('wrongCount').textContent=bank().filter(t=>wrong.has(t.id)).length}
function setTab(t){tab=t;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));render()}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));$('subject').onchange=()=>{session=null;render()};
function render(){stats();const c=$('content');c.innerHTML=!storageOK?'<div class="notice">瀏覽器暫時無法保存紀錄。你仍可練習，請匯出自訂題庫備份。</div>':'';
if(tab==='review'){c.innerHTML+='<div class="row"><h2>今天，先讀懂一個概念。</h2><span class="tag">重點卡片</span></div><p class="note">讀完重點後，切換出題練習確認理解。</p><div class="cards">'+pool().map(t=>'<article class="card"><span class="tag">'+esc(names[t.s])+'</span><h3>'+esc(t.k||t.q)+'</h3><p>'+esc(t.r||t.e)+'</p></article>').join('')+'</div>';if(!pool().length)c.innerHTML+='<div class="empty">這個主題還沒有題目。請先新增自訂題庫。</div>'}
if(tab==='quiz'){if(session){drawQuiz();return}c.innerHTML+='<div class="empty"><div class="icon">✍️</div><h2>準備好，測測你的理解。</h2><p>目前主題有 '+pool().length+' 題，隨機抽題且不重複。<br>每題選擇一個答案，再送出作答。</p><button id="start">開始練習 →</button></div>';$('start').disabled=!pool().length;$('start').onclick=()=>start(pool())}
if(tab==='wrong'){const items=pool().filter(t=>wrong.has(t.id));c.innerHTML+='<div class="row"><h2>錯題，是進步的線索。</h2><button id="retry" class="secondary">重練錯題</button></div><p class="note">答對後會從錯題清單移除。下列題目依目前主題篩選。</p>'+ (items.length?items.map(t=>'<article class="card" style="margin-top:14px"><span class="tag">'+esc(names[t.s])+'</span><h3>'+esc(t.q)+'</h3><details><summary>查看答案與解析</summary><p>正確答案：'+esc(t.o[t.a])+'<br>'+esc(t.e)+'</p></details></article>').join(''):'<div class="empty"><div class="icon">🌱</div><h3>目前沒有待複習錯題</h3><p>開始練習，逐步累積你的學習成果。</p></div>');$('retry').disabled=!items.length;$('retry').onclick=()=>{tab='quiz';document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));start(items)}}

$('add').onclick=()=>{const t={id:'c'+Date.now()+Math.random().toString(16).slice(2),s:'custom',q:$('cq').value.trim(),o:[0,1,2,3].map(i=>$('co'+i).value.trim()),a:Number($('ca').value),e:$('ce').value.trim()};if(!t.q||t.o.some(x=>!x)||!t.e){$('msg').textContent='請填寫題目、四個選項與答案解析。';return}custom.push(t);save();render();$('msg').textContent='已新增，選擇「我的自訂題目」即可練習。'};
$('export').textContent='匯出 Excel (.xlsx)';
$('export').onclick=()=>{const rows=[['題目','選項 A','選項 B','選項 C','選項 D','正確答案','答案解析'],...custom.map(t=>[t.q,...t.o,String.fromCharCode(65+t.a),t.e])];const x=v=>String(v).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[c]));const files={
'[Content_Types].xml':'<?xml version="1.0" encoding="UTF-8"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/></Types>',
