function start(items,wrongOnly=false){if(!wrongOnly&&items.length<50)return;let shuffled=[...items];for(let i=shuffled.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[shuffled[i],shuffled[j]]=[shuffled[j],shuffled[i]]}const key=$('subject').value;if(!wrongOnly){const signature=shuffled.slice(0,50).map(t=>t.id).sort().join('|');if(items.length>50&&lastDraw[key]===signature)[shuffled[0],shuffled[50]]=[shuffled[50],shuffled[0]];lastDraw[key]=shuffled.slice(0,50).map(t=>t.id).sort().join('|');save()}session={items:shuffled.slice(0,50),i:0,answers:[],selected:null,submitted:false,mode:$('mode').value};drawQuiz()}
function drawQuiz(){const c=$('content'),s=session;if(s.i>=s.items.length){const score=s.answers.filter((a,i)=>a===s.items[i].a).length;c.innerHTML='<div class="empty"><span class="tag">本回合完成</span><h2 style="margin-top:20px">每一次練習，都更靠近目標。</h2><div class="result-score">'+Math.round(score/s.items.length*100)+'<small style="font-size:20px"> 分</small></div><p>答對 '+score+' / '+s.items.length+' 題</p><button id="again">再練一次</button></div><h3>本回合作答與解析</h3>'+s.items.map((t,i)=>'<article class="card" style="margin-top:12px"><span class="tag">'+(s.answers[i]===t.a?'✓ 答對':'待加強')+'</span><h3>'+esc(t.q)+'</h3><p>你的答案：'+esc(t.o[s.answers[i]])+'<br>正確答案：'+esc(t.o[t.a])+'<br>'+esc(t.e)+'</p></article>').join('');$('again').onclick=()=>{session=null;render()};return}
const t=s.items[s.i];c.innerHTML='<div class="row"><span class="tag">'+esc(t.bankName||names[t.s])+'</span><span class="note">第 '+(s.i+1)+' / '+s.items.length+' 題</span></div><div class="bar"><i style="width:'+s.i/s.items.length*100+'%"></i></div><h2 class="question">'+esc(t.q)+'</h2>'+t.o.map((o,i)=>'<button class="option '+(s.selected===i?'selected ':'')+(s.submitted&&s.mode==='instant'?(i===t.a?'correct':i===s.selected?'wrong':''):'')+'" data-option="'+i+'" '+(s.submitted?'disabled':'')+'><span>'+String.fromCharCode(65+i)+'</span><span>'+esc(o)+'</span></button>').join('')+(s.submitted&&s.mode==='instant'?'<div class="feedback"><strong>'+(s.selected===t.a?'✓ 答對了！':'這題再記一下。正確答案是 '+String.fromCharCode(65+t.a))+'</strong><br>'+esc(t.e)+'</div>':'')+'<div class="actions"><button id="submit" '+(s.selected===null?'disabled':'')+'>'+(s.submitted?(s.i===s.items.length-1?'查看成績':'下一題 →'):'送出答案')+'</button><button id="quit" class="outline">結束本回合</button></div>';
c.querySelectorAll('[data-option]').forEach(b=>b.onclick=()=>{s.selected=Number(b.dataset.option);drawQuiz()});$('submit').onclick=()=>{if(s.submitted){s.i++;s.selected=null;s.submitted=false;drawQuiz();return}s.submitted=true;s.answers.push(s.selected);attempts++;if(s.selected===t.a){hits++;wrong.delete(t.id)}else wrong.add(t.id);save();drawQuiz()};$('quit').onclick=()=>{if(confirm('結束本回合？已送出的作答紀錄會保留。')){session=null;render()}}}
async function readXlsx(file){
const bytes=new Uint8Array(await file.arrayBuffer()),view=new DataView(bytes.buffer),entries=new Map();let end=-1;
for(let i=bytes.length-22;i>=Math.max(0,bytes.length-65557);i--){if(view.getUint32(i,true)===0x06054b50){end=i;break}}
if(end<0)throw Error('不是有效的 .xlsx 檔案');let pos=view.getUint32(end+16,true),expanded=0;const count=view.getUint16(end+10,true);
for(let i=0;i<count;i++){if(view.getUint32(pos,true)!==0x02014b50)throw Error('Excel 檔案結構不完整');const method=view.getUint16(pos+10,true),size=view.getUint32(pos+20,true),unpacked=view.getUint32(pos+24,true),n=view.getUint16(pos+28,true),extra=view.getUint16(pos+30,true),comment=view.getUint16(pos+32,true),offset=view.getUint32(pos+42,true),name=new TextDecoder().decode(bytes.slice(pos+46,pos+46+n));if(view.getUint16(pos+8,true)&1)throw Error('不支援加密的 Excel');expanded+=unpacked;if(expanded>20000000)throw Error('Excel 解壓縮後過大');entries.set(name,{method,size,offset});pos+=46+n+extra+comment}
const xml=async name=>{const entry=entries.get(name);if(!entry)throw Error('Excel 缺少 '+name);const start=entry.offset+30+view.getUint16(entry.offset+26,true)+view.getUint16(entry.offset+28,true);let data=bytes.slice(start,start+entry.size);if(entry.method===8){if(typeof DecompressionStream==='undefined')throw Error('請使用新版 Edge、Chrome 或 Safari 上傳 Excel');data=new Uint8Array(await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer())}else if(entry.method!==0)throw Error('不支援此 Excel 壓縮格式');const doc=new DOMParser().parseFromString(new TextDecoder().decode(data),'application/xml');if(doc.querySelector('parsererror'))throw Error('Excel XML 格式不正確');return doc};
const nodes=(el,n)=>Array.from(el.getElementsByTagNameNS('*',n)),text=el=>nodes(el,'t').map(t=>t.textContent).join('');
const shared=entries.has('xl/sharedStrings.xml')?nodes(await xml('xl/sharedStrings.xml'),'si').map(text):[];
const workbook=await xml('xl/workbook.xml'),first=nodes(workbook,'sheet')[0];if(!first)throw Error('Excel 沒有工作表');const id=first.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id');const rel=nodes(await xml('xl/_rels/workbook.xml.rels'),'Relationship').find(r=>r.getAttribute('Id')===id);if(!rel||rel.getAttribute('TargetMode')==='External')throw Error('工作表路徑不正確');let target=rel.getAttribute('Target');target=target.startsWith('/')?target.slice(1):'xl/'+target;const clean=[];for(const part of target.split('/')){if(part==='..')clean.pop();else if(part!=='.')clean.push(part)}
const rows=nodes(await xml(clean.join('/')),'row').map(r=>{const values=[];for(const c of nodes(r,'c')){const ref=c.getAttribute('r')||'',letters=ref.match(/^[A-Z]+/);if(!letters)continue;let col=0;for(const ch of letters[0])col=col*26+ch.charCodeAt(0)-64;if(col>100)continue;if(nodes(c,'f').length)throw Error('題庫請使用文字，不要使用公式');const type=c.getAttribute('t'),v=nodes(c,'v')[0]?.textContent||'';values[col-1]=type==='s'?shared[Number(v)]||'':type==='inlineStr'?text(c):v}return values});
const headerIndex=rows.findIndex(r=>r.some(v=>String(v||'').trim()));if(headerIndex<0)throw Error('Excel 沒有內容');const header=rows[headerIndex].map(v=>String(v||'').trim()),labels=['題目','選項 A','選項 B','選項 C','選項 D','正確答案','答案解析'],indexes=labels.map(n=>header.indexOf(n));if(indexes.some(i=>i<0))throw Error('欄位名稱不符，請使用下載的 Excel 範本');return rows.slice(headerIndex+1).filter(r=>r.some(v=>String(v||'').trim())).map((r,i)=>{const values=indexes.map(j=>String(r[j]||'').trim()),a='ABCD'.indexOf(values[5].toUpperCase());if(values[5].length!==1||a<0)throw Error('第 '+(headerIndex+i+2)+' 列的正確答案請填 A、B、C 或 D');return{q:values[0],o:values.slice(1,5),a,e:values[6]}})
}
